<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        /*
        TagName|classname|id
        {
            property:value;
            property:value;
        }*/

        h1{
            background-color: yellow;
            color: blue;
        }

        h2{
            background-color: blue;
            color: beige;
            border: 2px solid black;
        }

        .heading{
            background-color: aquamarine;
            color: blueviolet;
        }

        .bg-danger{
            background-color:red;
            color: black;
        }

        .border-success{
            border: 3px solid blueviolet;
        }

        .bg-primary{
            background-color: blue;
        }

        .text-white{
            color: white;

        }

    </style>
</head>
<body>
    
    <h1>internal css</h1>
    <h2>welcome to css journey</h2>

    <h1 class="heading">python</h1>
    <h1 class="bg-danger border-success">cascading style sheet</h1>

    <h1 class="bg-primary text-white">Django</h1>

</body>
</html>
