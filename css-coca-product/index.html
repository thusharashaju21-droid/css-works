<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coca-Cola Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <div class="card-image">
            <img src="./image/istockphoto-487787108-2048x2048.jpg" alt="Coca-Cola">
        </div>

        <div class="card-content">

            <div class="card-text">
                <p class="brand">COCA-COLA</p>
                <h2 class="card-product">Coca-Cola</h2>
                <p class="description">Refreshing taste. Original classic.</p>

                <h2 class="card-price">$15</h2>
            </div>

            <button>BUY NOW</button>

        </div>

    </div>

</body>

</html>
